<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon liviano (64x64, ~6KB) en vez de bajar el logo completo
         (912x913, 123KB) en cada carga de página solo para el ícono de la
         pestaña. El logo grande se sigue usando tal cual para las meta
         og:image/twitter:image de abajo (esas las piden los crawlers de
         redes sociales, no el navegador del usuario en cada visita). -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Adelanta la conexión al backend: /api/products es lo primero que
         pide la página y hoy espera a que el bundle JS se ejecute para
         recién ahí abrir la conexión. -->
    <link rel="preconnect" href="https://sellos-pro.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://sellos-pro.onrender.com" />
    <!-- Ojo: NO preloadear acá la imagen del Hero. index.html es el único
         documento de esta SPA (se sirve igual para /, /catalog, /checkout,
         etc.), así que un <link rel="preload"> acá se descarga en TODAS las
         rutas, no solo en Home. Ya lo tuvimos como bug: en /catalog bajaba
         177KB de Hero1.webp a máxima prioridad sin usarla, compitiendo con
         la imagen real del LCP de esa página. -->

    <meta name="color-scheme" content="light" />
    <style>
      :root {
        color-scheme: light;
      }
    </style>

    <title>Sellospro - Sellos Personalizados en Mar del Plata</title>
    <meta
      name="description"
      content="Diseñamos y fabricamos sellos automáticos, de madera, fechadores y más. Calidad profesional y envío rápido en Mar del Plata."
    />

    <meta
      name="keywords"
      content="sellos, sellos personalizados, sellos automáticos, sellos de madera, fechadores, numeradores, Mar del Plata, Sellospro"
    />

    <link rel="canonical" href="https://www.sellospro.com.ar/" />

    <meta
      property="og:title"
      content="Sellospro - Sellos Personalizados en Mar del Plata"
    />
    <meta
      property="og:description"
      content="Calidad profesional en sellos automáticos, de madera y más. Diseño a medida."
    />

    <meta
      property="og:image"
      content="https://www.sellospro.com.ar/LogoSellos.jpg"
    />
    <meta property="og:url" content="https://www.sellospro.com.ar/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Sellospro - Sellos Personalizados en Mar del Plata"
    />
    <meta
      name="twitter:description"
      content="Calidad profesional en sellos automáticos, de madera y más. Diseño a medida."
    />

    <meta
      name="twitter:image"
      content="https://www.sellospro.com.ar/LogoSellos.jpg"
    />
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
